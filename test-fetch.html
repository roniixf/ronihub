<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Fetch</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #111; color: #0f0; }
    button { padding: 15px 30px; font-size: 16px; background: #6366f1; color: white; border: none; border-radius: 8px; margin: 10px 0; }
    pre { background: #000; padding: 15px; border-radius: 8px; white-space: pre-wrap; word-break: break-all; font-size: 12px; }
    .ok { color: #0f0; }
    .err { color: #f00; }
  </style>
</head>
<body>
  <h2>🧪 Test Fetch API</h2>
  <input id="url" value="https://www.instagram.com/reel/DdskcIgpbN4/" style="width:100%;padding:10px;font-size:14px;">
  <br>
  <button onclick="test()">🚀 Test API</button>
  <pre id="log">Klik tombol untuk test...</pre>

<script>
async function test() {
  const log = document.getElementById('log');
  const url = document.getElementById('url').value;
  log.textContent = '📡 Sending...\n';
  
  const start = Date.now();
  try {
    const res = await fetch('api.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url }),
    });
    
    const elapsed = ((Date.now() - start) / 1000).toFixed(1);
    log.textContent += `✅ Response: ${res.status} (${elapsed}s)\n\n`;
    
    const text = await res.text();
    log.textContent += `📄 Body:\n${text}\n`;
    
    try {
      const data = JSON.parse(text);
      if (data.success) {
        log.textContent += `\n✅ SUCCESS!\n`;
        log.textContent += `Platform: ${data.platform}\n`;
        log.textContent += `Username: ${data.username}\n`;
        log.textContent += `Medias: ${data.medias.length}\n`;
        data.medias.forEach((m, i) => {
          log.textContent += `  #${i+1}: ${m.type} ${m.quality || ''} ${m.url.substring(0, 80)}...\n`;
        });
      } else {
        log.textContent += `\n❌ API Error: ${data.message}\n`;
      }
    } catch (e) {
      log.textContent += `\n❌ Parse error: ${e.message}\n`;
    }
  } catch (err) {
    log.textContent += `\n❌ Fetch error: ${err.message}\n`;
  }
}
</script>
</body>
</html>
